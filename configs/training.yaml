# ============================================================
# PSF DINOv2 Fine-Tuning – FINAL TRAINING CONFIGURATION
# ============================================================

# ----- Data -----
data:
  root: "."
  image_dir: "Renamed Images"
  labels_csv: "labels.csv"
  image_col: "Name"
  label_cols: ["Creativity", "Belonging", "EaseOfUse"]
  image_ext: ".png"
  val_split: 0.15                  # 15% validation split
  test_split: 0.15                 # 15% strictly held-out test split
  img_size: 518                    # DINOv2 native resolution (faster & lower VRAM)

# ----- Model -----
model:
  backbone: "vit_base_patch14_dinov2"
  pretrained: true
  embed_dim: 768
  head_hidden: 256                 # Matching checkpoint
  dropout: 0.3                     # Slightly higher dropout for better generalisation
  num_outputs: 3

# ----- Training -----
train:
  seed: 2026
  deterministic: true
  
  # Phase 1 – Stabilise Head (Frozen Backbone)
  freeze_epochs: 15
  lr_head: 2.0e-4
  
  # Phase 2 – Deep Fine-Tuning (Partial Unfreeze)
  finetune_epochs: 250             # Extended training for deep refinement
  lr_finetune: 5.0e-5              # Conservative LR for backbone
  unfreeze_blocks: 4               # Unfreeze more blocks for architectural features
  
  # Common Hyperparameters
  batch_size: 4                    # Optimized for RTX 4050 6GB
  num_workers: 4
  weight_decay: 0.1                # Increased regularization
  use_ema: true                    # Shadow weights for better generalization
  ema_decay: 0.999
  
  # Scheduler
  scheduler: "cosine"
  warmup_epochs: 3
  min_lr: 1.0e-6
  
  # Early stopping
  patience: 40                     # Increased patience for longer run
  amp: true                        # Mixed precision for speed

# ----- Augmentation (ENABLED) -----
augmentation:
  enabled: true
  random_resized_crop:
    scale: [0.7, 1.0]              # Slightly more aggressive cropping
  horizontal_flip_prob: 0.5
  rotation_degrees: 15             # Up to 15 degrees
  color_jitter:
    brightness: 0.15
    contrast: 0.15
    saturation: 0.15
    hue: 0.05
  gaussian_blur:
    prob: 0.3
    kernel_size: 3
    sigma: [0.1, 2.0]
  random_perspective:
    prob: 0.2
    distortion_scale: 0.4
  random_affine:
    prob: 0.2
    degrees: 0
    translate: [0.1, 0.1]
    scale: [0.9, 1.1]

# ----- Checkpointing -----
checkpoint:
  dir: "checkpoints/final_run"
  save_best: true
  metric: "val_mae"

# ----- Logging -----
logging:
  wandb: false
  tensorboard: true
  log_dir: "runs/final_run"
